name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.19.0", "22"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Verify k6 installation
        run: k6 version

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run live k6 end-to-end test
        run: npm run test:live-e2e
        timeout-minutes: 5
