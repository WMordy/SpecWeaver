name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Verify the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches package version ${version}"

      - name: Verify the trusted-publishing toolchain floor
        run: |
          echo "node $(node --version), npm $(npm --version)"
          node -e '
          const { execSync } = require("node:child_process");
          const [major, minor, patch] = execSync("npm --version", { encoding: "utf8" })
            .trim()
            .split(".")
            .map(Number);
          const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
          if (!ok) {
            console.error(`npm ${major}.${minor}.${patch} is below the 11.5.1 floor for trusted publishing`);
            process.exit(1);
          }
          '

      - name: Verify the version is not already published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "specweaver@${version}" version >/dev/null 2>&1; then
            echo "::error::specweaver@${version} is already published and cannot be republished"
            exit 1
          fi
          echo "specweaver@${version} is unpublished"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Publish to npm
        run: npm publish
