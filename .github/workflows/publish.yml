name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches package version ${version}"

      - name: Verify the release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::release ${GITHUB_REF_NAME} already exists and cannot be replaced"
            exit 1
          fi
          echo "release ${GITHUB_REF_NAME} does not exist yet"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Pack the release tarball
        run: |
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          cp "$(ls release/specweaver-*.tgz)" release/specweaver.tgz
          (cd release && sha256sum *.tgz > SHA256SUMS)
          ls -l release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/*.tgz release/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
