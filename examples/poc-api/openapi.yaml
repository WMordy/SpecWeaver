openapi: 3.0.3
info:
  title: SpecWeaver POC API
  version: 1.0.0
  description: |
    Deterministic, dependency-free local API intended for SpecWeaver examples
    and the planned live end-to-end test. It is example/test infrastructure, not
    a production service. The document deliberately includes three v1 coverage-gap surfaces:
    a cookie parameter, a required non-JSON (multipart) request body, and a
    bearer security requirement without a configured auth mapping.
servers:
  - url: http://127.0.0.1:8080
    description: Default local POC API listener

tags:
  - name: system
  - name: pets
  - name: owners
  - name: admin
  - name: recommendations

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Service readiness and version
      responses:
        "200":
          description: The service is ready.
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: poc-api
                  version:
                    type: string
                    example: 1.0.0

  /pets:
    get:
      tags: [pets]
      operationId: listPets
      summary: List pets in insertion order
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of pets to return (1-100).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 100
          example: 10
        - name: tag
          in: query
          required: false
          description: Only return pets with this tag.
          schema:
            type: string
          example: dog
      responses:
        "200":
          description: Pets in insertion order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        "400":
          description: Invalid query parameters (for example an out-of-range limit).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid_limit
    post:
      tags: [pets]
      operationId: createPet
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: The created pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Malformed JSON or invalid input; the store is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pets/{petId}:
    get:
      tags: [pets]
      operationId: getPet
      summary: Get a pet by id
      parameters:
        - name: petId
          in: path
          required: true
          description: The id of the pet to fetch.
          schema:
            type: string
          example: "1"
      responses:
        "200":
          description: The matching pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: No pet has that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not_found

  /owners:
    get:
      tags: [owners]
      operationId: listOwners
      summary: List owners
      responses:
        "200":
          description: All owners.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Owner"

  /owners/{ownerId}:
    get:
      tags: [owners]
      operationId: getOwner
      summary: Get an owner by id
      parameters:
        - name: ownerId
          in: path
          required: true
          description: The id of the owner to fetch.
          schema:
            type: string
          example: "1"
      responses:
        "200":
          description: The matching owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "404":
          description: No owner has that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not_found

  /admin/stats:
    get:
      tags: [admin]
      operationId: getStats
      summary: In-memory store statistics (bearer protected)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current in-memory counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "401":
          description: Missing or incorrect bearer token.
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: unauthorized

  /recommendations:
    get:
      tags: [recommendations]
      operationId: getRecommendations
      summary: Recommended pets (declares a cookie parameter)
      description: |
        Declares an optional cookie parameter. The POC handler deliberately does
        not read cookies; it always returns a deterministic seed subset.
      parameters:
        - name: session
          in: cookie
          required: false
          description: Session cookie (declared only; not parsed by the POC).
          schema:
            type: string
          example: demo-session
      responses:
        "200":
          description: Recommended seed pets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"

  /pets/{petId}/photo:
    post:
      tags: [pets]
      operationId: uploadPetPhoto
      summary: Upload a pet photo (declares a required multipart body)
      description: |
        Declares a required multipart/form-data body. The POC handler does not
        parse the multipart body; it only acknowledges a known pet id.
      parameters:
        - name: petId
          in: path
          required: true
          description: The id of the pet the photo belongs to.
          schema:
            type: string
          example: "1"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        "202":
          description: The upload was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoAck"
        "404":
          description: No pet has that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not_found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Send `Authorization: Bearer POC-TOKEN`."
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Fido
        tag:
          type: string
          default: unknown
        age:
          type: integer
          format: int32
          minimum: 0
          maximum: 30
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Fido
        tag:
          type: string
          example: dog
        age:
          type: integer
          format: int32
          minimum: 0
          maximum: 30
          example: 3
    Owner:
      type: object
      required: [id, name, email, petIds]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Alice
        email:
          type: string
          format: email
          example: alice@example.com
        petIds:
          type: array
          items:
            type: integer
            format: int64
          example: [1, 2]
    Stats:
      type: object
      required: [pets, owners, createdPets]
      properties:
        pets:
          type: integer
          example: 3
        owners:
          type: integer
          example: 2
        createdPets:
          type: integer
          example: 0
    PhotoAck:
      type: object
      required: [accepted, petId]
      properties:
        accepted:
          type: boolean
          example: true
        petId:
          type: integer
          example: 1
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: not_found
        detail:
          type: string
          description: Optional human-readable detail.
