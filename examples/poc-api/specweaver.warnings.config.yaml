# Coverage-warning demo config for the POC API (SPEC-27).
#
# Run from the repository root against a locally running POC server
# (node examples/poc-api/server.js):
#
#   node dist/cli.js --config examples/poc-api/specweaver.warnings.config.yaml --vus 1 --duration 2s
#
# `operations: all` with no `auth` selects every operation in openapi.yaml and
# deliberately exercises the remaining v1 coverage gaps. Exactly two
# `warning:` lines are expected on stderr (one per gap):
#
#   1. GET /admin/stats declares bearer security but no auth is configured, so
#      the request goes out unauthenticated;
#   2. POST /pets/{petId}/photo requires a non-JSON (multipart/form-data) body,
#      so SpecWeaver sends it without a body.
#
# GET /recommendations declares an optional cookie parameter; it is generated
# and sent in a Cookie header, so it no longer warns.
#
# The run still exits 0. Because /admin/stats is unauthenticated, its response
# is 401 and its documented-200 k6 check fails; that failure is expected here
# and must not be hidden.
specs:
  - examples/poc-api/openapi.yaml

operations: all
