openapi: 3.0.3
info:
  title: SpecWeaver POC API — Owners
  version: 1.0.0
  description: |
    Second local OpenAPI document for the multi-spec example. It describes the
    owners resource implemented by examples/poc-api/server.js and is loaded
    alongside samples/petstore.openapi.json. It is example infrastructure, not
    a product surface.
servers:
  - url: http://127.0.0.1:8080
    description: Default local POC API listener
tags:
  - name: owners

paths:
  /owners:
    get:
      tags: [owners]
      operationId: listOwners
      summary: List owners
      responses:
        "200":
          description: All owners in insertion order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Owner"

  /owners/{ownerId}:
    get:
      tags: [owners]
      operationId: getOwner
      summary: Get an owner by id
      parameters:
        - name: ownerId
          in: path
          required: true
          description: The id of the owner to fetch.
          schema:
            type: string
          example: "1"
      responses:
        "200":
          description: The matching owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "404":
          description: No owner has that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not_found

components:
  schemas:
    Owner:
      type: object
      required: [id, name, email, petIds]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Alice
        email:
          type: string
          format: email
          example: alice@example.com
        petIds:
          type: array
          items:
            type: integer
            format: int64
          example: [1, 2]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: not_found
        detail:
          type: string
          description: Optional human-readable detail.
