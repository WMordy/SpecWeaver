# SpecWeaver sample config.
#
# Reference: from the repository root run either
#   specweaver --config samples/specweaver.config.yaml   # after `npm i -g .`; see README "Install and requirements"
#   node dist/cli.js --config samples/specweaver.config.yaml   # no global install
# Relative `specs` paths are resolved against the current working directory,
# so run the example from the repo root (where `samples/` lives).
#
# The full config schema is documented in README.md.

# OpenAPI source(s) to load: local file path(s) and/or absolute http(s) URLs.
# Required to execute; string or list of strings.
# Requests default to the first usable `servers[].url` across the specs
# (unusable entries are skipped with a warning). Add an optional `baseUrl:` (see
# the README) to point the generated tests at a different host without editing
# the spec. Without a `baseUrl`, that fallback must be an absolute http(s) URL or
# the run exits 2 before k6.
specs:
  - samples/petstore.openapi.json

# Operations to test. REQUIRED: either a non-empty list of `{ method, path }`
# entries or the exact literal `all`. The explicit list below demonstrates the
# opt-in form and the auth/payload overrides. For the zero-override alternative
# (`operations: all` with no auth, payloads, or baseUrl), see
# samples/specweaver.zero-override.yaml and the README's "Zero-override run"
# section. With `all`, every operation catalogued from every spec is tested.
operations:
  - method: GET
    path: /pets
  - method: POST
    path: /pets
  - method: GET
    path: /pets/{petId}

# Static auth injected into every selected request. `${ENV_VAR}` references are
# resolved from the process environment; an unresolved one is a warning, not an
# error. This sample uses a literal token so no environment setup is required.
auth:
  token: POC-TOKEN
  headers:
    X-Client: specweaver-sample

# Per-operation JSON body overrides (keyed by method + path). Optional.
# `body` REPLACES the body generated from the spec example/default/faker for the
# matching operation (whole value, not a deep merge). Matching normalizes method
# case. This value is deliberately different from the spec's `Fido`/`dog`
# example so a run visibly proves the override was applied. Overrides that match
# no selected operation warn on stderr; unsupported keys are config errors.
payloads:
  - method: POST
    path: /pets
    body:
      name: SampleOverridePet
      tag: override

# Results JSON path. Optional. `--out` overrides it; otherwise it defaults to
# `specweaver-results.json` in the current working directory.
output: specweaver-results.json

# Default load profile. Optional. `--vus` / `--duration` override these.
load:
  vus: 2
  duration: 5s
